# 推送 v* tag 触发: 构建 linux/amd64 二进制 + Docker 镜像, 发布 GitHub Release。
# 程序内「系统更新」读取最新 Release 的 ad-monitor_<tag>_linux_amd64.tar.gz 与 SHA256SUMS。
#   git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./internal/logic/issue/ ./internal/logic/updater/
          go test -count=1 ./internal/logic/issue/ ./internal/logic/updater/

      - name: Build binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X ad-monitor/internal/logic/updater.Version=${VERSION}" \
            -o dist/ad-monitor .
          test "$(./dist/ad-monitor --version)" = "${VERSION}"
          tar -czf "dist/ad-monitor_${VERSION}_linux_amd64.tar.gz" -C dist ad-monitor
          (cd dist && sha256sum "ad-monitor_${VERSION}_linux_amd64.tar.gz" > SHA256SUMS)

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推送成功后再发布 Release, 避免程序检测到新版本时镜像还不存在
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" \
            "dist/ad-monitor_${VERSION}_linux_amd64.tar.gz" dist/SHA256SUMS \
            --title "${VERSION}" --generate-notes
